<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style/styles.css">
    <link rel="stylesheet" href="./style/login.css">
    <link rel="stylesheet" href="./style/variaveis.css">
    <title>ENTRAR | HBO MAX</title>
</head>

<body>
    <header class="header">
        <nav class="menu">
            <a href="index.html" class="menu_logo">
                <img src="./assets/images/hbo-logo.svg" alt="Logotipo HBOMax com o nome da marca">
            </a>

            <div class="btn-global">
                <a href="#" class="menu_item">ENTRAR</a>
                <a href="#subscription" class="menu_item menu_item--button button">Assine Agora</a>
            </div>
        </nav>
    </header>

    <main class="main-content">
        

        <form class="formulario container" action="">
            <h1>Entrar</h1>
            <p>Você tem uma conta da HBO Max?</p>

            <label>
                <input class="campo-login" type="email" placeholder="Endereço de e-mail">
            </label>

            <label>
                <input class="campo-login"  type="password" placeholder="Senha">
            </label>

            <div class="btn">
                <button type="submit" class="button button--gradient">ENTRAR</button>
                <a class="lembrar-senha" href="#">Esqueceu a senha?</a>
            </div>

        </form>



    </main>

    <footer class="footer container">
        <div class="link-list">
            <ul>
                <li class="list-item"><a href="">Agora na HBO Max</a></li>
                <li class="list-item"><a href="">Em breve</a></li>
                <li class="list-item"><a href="">Filme em destaque</a></li>
                <li class="list-item"><a href="">Séries</a></li>
                <li class="list-item"><a href="">Ajuda</a></li>
            </ul>
        </div>

        <p class="text-footer">© 2022 WarnerMedia Direct Latin America, LLC. Todos os direitos reservados. HBO Max é
            usado sob licença.</p>

        <div class="list-icon">
            <a href=""><img src="./assets/images/fb_0.png" alt=""></a>
            <a href=""><img src="./assets/images/twitter_0.png" alt=""></a>
            <a href=""><img src="./assets/images/instagram_0.png" alt=""></a>
            <a href=""><img src="./assets/images/youtube_0.png" alt=""></a>
        </div>

    </footer>
